# iCoolKJ 代码生成表清单 — 与 V1__init_icoolkj_platform.sql 对齐
# base: tenant | platform | base | plain
#   tenant   -> extends TenantBaseEntity
#   platform -> extends BaseEntity（含 tenant_id 的平台+租户覆盖表）
#   base     -> extends BaseEntity（无 tenant_id，如 sys_menu）
#   plain    -> 独立实体（关联表/流水表）

sql_file: backend/database/migration/V1__init_icoolkj_platform.sql

modules:
  system:
    package: com.icoolkj.platform.system
    java_dir: backend/icoolkj-admin-system/src/main/java/com/icoolkj/platform/system
    xml_dir: backend/icoolkj-admin-system/src/main/resources/mapper/system
  infra:
    package: com.icoolkj.platform.infra
    java_dir: backend/icoolkj-admin-infra/src/main/java/com/icoolkj/platform/infra
    xml_dir: backend/icoolkj-admin-infra/src/main/resources/mapper/infra

tables:
  - table: sys_tenant
    module: system
    entity: TenantEntity
    mapper: TenantMapper
    base: base
    list_filters: [tenantCode, tenantName, status]
    custom: TenantMapper

  - table: sys_user
    module: system
    entity: UserEntity
    mapper: UserMapper
    base: tenant
    list_filters: [tenantId, username, nickname, phone, status, deptId]
    custom: UserMapper

  - table: sys_role
    module: system
    entity: RoleEntity
    mapper: RoleMapper
    base: tenant
    list_filters: [tenantId, roleName, roleCode, status]

  - table: sys_user_role
    module: system
    entity: UserRoleEntity
    mapper: UserRoleMapper
    base: plain
    has_id: false
    list_filters: [tenantId, userId, roleId]
    custom: UserRoleMapper

  - table: sys_menu
    module: system
    entity: MenuEntity
    mapper: MenuMapper
    base: base
    list_filters: [menuName, menuType, status, parentId]
    custom: MenuMapper

  - table: sys_role_menu
    module: system
    entity: RoleMenuEntity
    mapper: RoleMenuMapper
    base: plain
    has_id: false
    list_filters: [tenantId, roleId, menuId]
    custom: RoleMenuMapper

  - table: sys_dept
    module: system
    entity: DeptEntity
    mapper: DeptMapper
    base: tenant
    list_filters: [tenantId, deptName, deptCode, status, parentId]

  - table: sys_post
    module: system
    entity: PostEntity
    mapper: PostMapper
    base: tenant
    list_filters: [tenantId, postName, postCode, status]

  - table: sys_user_post
    module: system
    entity: UserPostEntity
    mapper: UserPostMapper
    base: plain
    has_id: false
    list_filters: [tenantId, userId, postId]

  - table: sys_role_dept
    module: system
    entity: RoleDeptEntity
    mapper: RoleDeptMapper
    base: plain
    has_id: false
    list_filters: [tenantId, roleId, deptId]

  - table: sys_dict_type
    module: system
    entity: DictTypeEntity
    mapper: DictTypeMapper
    base: platform
    list_filters: [tenantId, dictName, dictType, status]

  - table: sys_dict_item
    module: system
    entity: DictItemEntity
    mapper: DictItemMapper
    base: platform
    list_filters: [tenantId, dictTypeId, dictLabel, dictValue, status]

  - table: sys_config
    module: system
    entity: ConfigEntity
    mapper: ConfigMapper
    base: platform
    list_filters: [tenantId, configName, configKey, configType]
    custom: ConfigMapper

  - table: sys_notice
    module: system
    entity: NoticeEntity
    mapper: NoticeMapper
    base: platform
    list_filters: [tenantId, noticeTitle, noticeType, status]

  - table: sys_site_message
    module: system
    entity: SiteMessageEntity
    mapper: SiteMessageMapper
    base: tenant
    list_filters: [tenantId, messageSubject, messageCategory]

  - table: sys_ip_access_rule
    module: system
    entity: IpAccessRuleEntity
    mapper: IpAccessRuleMapper
    base: platform
    list_filters: [tenantId, ruleName, ruleType, applyScope, status]
    custom: IpAccessRuleMapper

  - table: sys_login_log
    module: system
    entity: LoginLogEntity
    mapper: LoginLogMapper
    base: plain
    has_deleted: false
    order_by: login_at DESC
    list_filters: [tenantId, username, loginStatus]

  - table: sys_operation_log
    module: system
    entity: OperationLogEntity
    mapper: OperationLogMapper
    base: plain
    has_deleted: false
    order_by: operation_at DESC
    list_filters: [tenantId, operatorId, operationStatus, moduleName]

  - table: infra_file
    module: infra
    entity: InfraFileEntity
    mapper: InfraFileMapper
    base: plain
    has_deleted: false
    order_by: uploaded_at DESC
    list_filters: [tenantId, bizType, bizId]

  - table: infra_async_task
    module: infra
    entity: AsyncTaskEntity
    mapper: AsyncTaskMapper
    base: tenant
    list_filters: [tenantId, taskType, taskStatus]

  # infra_async_task_log: reserved schema only — no menu; user actions audited via sys_operation_log

  - table: infra_api_access_log
    module: infra
    entity: ApiAccessLogEntity
    mapper: ApiAccessLogMapper
    base: plain
    has_deleted: false
    order_by: accessed_at DESC
    list_filters: [tenantId, userId, requestUri]

  - table: infra_thirdparty_call_log
    module: infra
    entity: ThirdPartyCallLogEntity
    mapper: ThirdPartyCallLogMapper
    base: plain
    has_deleted: false
    order_by: called_at DESC
    list_filters: [tenantId, providerName, responseStatus]
