# Local development: MySQL 8 + Redis (+ optional MinIO)
# Usage: docker compose -f deploy/docker-compose.dev.yml up -d

services:
  mysql:
    image: mysql:8.0
    container_name: icoolkj-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "ChangeMe_Root_123!"
      MYSQL_DATABASE: icoolkj_platform_dev
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - icoolkj-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pChangeMe_Root_123!"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: icoolkj-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - icoolkj-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: icoolkj-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ChangeMe_Minio_User
      MINIO_ROOT_PASSWORD: "ChangeMe_Minio_123!"
    command: server /data --console-address ":9001"
    volumes:
      - icoolkj-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  icoolkj-mysql-data:
  icoolkj-redis-data:
  icoolkj-minio-data:
