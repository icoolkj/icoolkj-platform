# Shared demo overrides (api + worker, profile=demo)
# 公网演示：只读 API；本地默认同 dev 库，生产演示通过环境变量覆盖 DB/JWT。
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/icoolkj_platform_dev?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

logging:
  level:
    com.icoolkj.platform: info

icoolkj:
  demo:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:demo-jwt-secret-change-me-at-least-32-bytes}
  async:
    provider: redis-stream
