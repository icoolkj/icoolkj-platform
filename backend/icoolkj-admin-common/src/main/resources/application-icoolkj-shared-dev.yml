# Shared dev overrides (api + worker, profile=dev)
# Local secrets stay here (dev-only). Prefer env vars; never copy into prod YAML.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/icoolkj_platform_dev?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
  data:
    redis:
      password: ${REDIS_PASSWORD:}

logging:
  level:
    com.icoolkj.platform: debug

icoolkj:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-change-me-at-least-32-bytes}
  storage:
    provider: local
  async:
    provider: redis-stream
  generator:
    enabled: true
    disk-write-enabled: true
