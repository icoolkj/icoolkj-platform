server:
  port: 8081
  servlet:
    context-path: /worker
  forward-headers-strategy: framework

spring:
  application:
    name: icoolkj-admin-worker
  profiles:
    active: dev
  config:
    import:
      - classpath:application-icoolkj-shared.yml
      - optional:classpath:application-icoolkj-shared-${spring.profiles.active}.yml

  datasource:
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10

  flyway:
    enabled: false

  main:
    allow-circular-references: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}

icoolkj:
  security:
    enabled: false

  id:
    worker-id: 2
    datacenter-id: 1

  # Role only — provider comes from shared-*.yml; queue/retry/DLQ = AsyncProperties defaults
  async:
    consume: true

  logging:
    retention:
      login-log-days: 180
      operation-log-days: 180
      api-access-log-days: 90
      archive-login-log-days: 365
      archive-operation-log-days: 365
      archive-api-access-log-days: 180
